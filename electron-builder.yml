appId: com.local.studiomp3pro
productName: Studio MP3 PRO
copyright: StudioMP3Pro
directories:
  output: dist
files:
  - package.json
  - src/**/*
asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**
afterPack: scripts/after-pack.js
mac:
  category: public.app-category.music
  identity: null
  icon: build/icon.png
  target:
    - dmg
  artifactName: Studio-MP3-PRO-${version}-mac-${arch}.${ext}
dmg:
  sign: false
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: Studio-MP3-PRO-Setup-${version}-win-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Studio MP3 PRO
  runAfterFinish: true
  deleteAppDataOnUninstall: false

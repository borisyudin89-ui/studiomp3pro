<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Studio MP3 PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="logo.png" alt="">
        <span class="brand-name">Studio MP3 PRO</span>
      </div>
      <label class="pill">
        <span class="pill-label">Качество</span>
        <select id="bitrate" aria-label="Качество MP3">
          <option value="320">320 kbps</option>
          <option value="256">256 kbps</option>
          <option value="192">192 kbps</option>
          <option value="128">128 kbps</option>
          <option value="v0">V0 (VBR)</option>
        </select>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
      </label>
    </header>

    <main class="body">
      <div id="drop" class="drop">
        <div id="arrow" class="arrow" role="img" aria-label="Перетащите файлы сюда или нажмите, чтобы выбрать">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V5M6.5 10.5L12 5l5.5 5.5M5 20h14"/></svg>
        </div>
        <ul id="list" class="list" hidden></ul>
      </div>
    </main>

    <footer class="foot">
      <div id="barWrap" class="foot-bar"><div id="overallBar" class="foot-bar-fill"></div></div>
      <div class="foot-left">
        <span id="summaryText" class="foot-text" hidden></span>
        <button id="pickFolder" class="link">+ Добавить папку…</button>
      </div>
      <div class="foot-btns">
        <button id="clear" class="btn" hidden>Очистить</button>
        <button id="cancel" class="btn coral-ghost" hidden>Отмена</button>
        <button id="start" class="btn coral" disabled>Конвертировать</button>
      </div>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Studio MP3 PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#26292e"/>
          <g fill="#4a6bff">
            <rect x="5" y="13" width="2.6" height="6" rx="1.3"/>
            <rect x="9.4" y="10" width="2.6" height="12" rx="1.3"/>
            <rect x="13.7" y="6.5" width="2.6" height="19" rx="1.3"/>
            <rect x="18" y="10" width="2.6" height="12" rx="1.3"/>
            <rect x="22.4" y="13" width="2.6" height="6" rx="1.3"/>
          </g>
        </svg>
        <span class="brand-name">Studio MP3 PRO</span>
      </div>
      <label class="pill">
        <span class="pill-label">Качество</span>
        <select id="bitrate" aria-label="Качество MP3">
          <option value="320">320 kbps</option>
          <option value="256">256 kbps</option>
          <option value="192">192 kbps</option>
          <option value="128">128 kbps</option>
          <option value="v0">V0 (VBR)</option>
        </select>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
      </label>
    </header>

    <main class="body">
      <div id="drop" class="drop">
        <div class="drop-ico">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14V4M6 8l4-4 4 4M4 16h12"/></svg>
        </div>
        <div class="drop-title">Перетащите аудиофайлы или папку</div>
        <div class="drop-sub">m4a, wav, flac, aac, ogg, opus, wma, aiff и другие — превратим в MP3</div>
        <div class="drop-btns">
          <button id="pickFiles" class="btn blue">Выбрать файлы…</button>
          <button id="pickFolder" class="btn">Выбрать папку…</button>
        </div>
      </div>

      <div class="table">
        <div class="thead"><span>Файл</span><span>Статус</span><span class="r">Размер</span></div>
        <ul id="list" class="tbody"></ul>
      </div>
    </main>

    <footer class="foot">
      <div class="foot-bar"><div id="overallBar" class="foot-bar-fill"></div></div>
      <span id="summaryText" class="foot-text">Список пуст</span>
      <div class="foot-btns">
        <button id="clear" class="btn">Очистить</button>
        <button id="cancel" class="btn danger" disabled>Отмена</button>
        <button id="start" class="btn blue strong" disabled>Конвертировать</button>
      </div>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

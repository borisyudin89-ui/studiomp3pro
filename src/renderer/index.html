<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>MP3 Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div id="drop" class="drop">
      <div class="drop-title">Перетащите сюда аудиофайлы или папку</div>
      <div class="drop-sub">m4a, wav, flac, aac, ogg, opus, wma, aiff и другие → MP3</div>
      <div class="drop-buttons">
        <button id="pickFiles" class="secondary">Выбрать файлы…</button>
        <button id="pickFolder" class="secondary">Выбрать папку…</button>
      </div>
    </div>

    <div class="toolbar">
      <label>Качество
        <select id="bitrate">
          <option value="320">320 kbps</option>
          <option value="256">256 kbps</option>
          <option value="192">192 kbps</option>
          <option value="128">128 kbps</option>
          <option value="v0">V0 (VBR, лучшее)</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button id="clear" class="secondary">Очистить список</button>
      <button id="cancel" class="danger" disabled>Отмена</button>
      <button id="start" class="primary" disabled>Конвертировать</button>
    </div>

    <div class="summary">
      <div id="summaryText">Список пуст</div>
      <div class="bar"><div id="overallBar" class="bar-fill"></div></div>
    </div>

    <ul id="list" class="list"></ul>
  </main>
  <script src="renderer.js"></script>
</body>
</html>

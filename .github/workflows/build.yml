name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-intel
            os: macos-15-intel
            script: dist:mac-x64
          - name: mac-apple-silicon
            os: macos-latest
            script: dist:mac-arm64
          - name: windows
            os: windows-latest
            script: dist:win
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Tests (ffmpeg из приложения)
        run: npm test

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(ls -d dist/mac*/"MP3 Converter.app")
          echo "Запускаю: $APP"
          SELFTEST_OUT="$RUNNER_TEMP/selftest.json" "$APP/Contents/MacOS/MP3 Converter" --selftest || true
          cat "$RUNNER_TEMP/selftest.json"; echo
          grep -q '"ok":true' "$RUNNER_TEMP/selftest.json"

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export SELFTEST_OUT="$RUNNER_TEMP/selftest.json"
          "dist/win-unpacked/MP3 Converter.exe" --selftest || true
          cat "$SELFTEST_OUT"; echo
          grep -q '"ok":true' "$SELFTEST_OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Converter-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
